<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Static Code Analysis Report</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #38bdf8;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }
        .summary-cards {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .card {
            flex: 1;
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .card h3 {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
        }
        .card p {
            margin: 10px 0 0;
            font-size: 28px;
            font-weight: bold;
            color: #34d399;
        }
        .card.error p { color: #f87171; }
        .card.warning p { color: #fbbf24; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            text-align: left;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-warning { background-color: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .badge-error { background-color: rgba(248, 113, 113, 0.2); color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Static Code Analysis Summary Report</h1>
        <p>Target Files: <code>calculator.py</code>, <code>app.py</code></p>
        
        <div class="summary-cards">
            <div class="card">
                <h3>Pylint Rating Score</h3>
                <p>10.00 / 10</p>
            </div>
            <div class="card error">
                <h3>Critical Errors</h3>
                <p>0</p>
            </div>
            <div class="card warning">
                <h3>Style Warnings</h3>
                <p>0</p>
            </div>
        </div>

        <h2>Detailed Issues Log</h2>
        <table>
            <thead>
                <tr>
                    <th>Module</th>
                    <th>Line</th>
                    <th>Category</th>
                    <th>Message</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td colspan="4" style="text-align: center; color: #94a3b8;">No static analysis issues detected. Clean code standard achieved! 🎉</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
