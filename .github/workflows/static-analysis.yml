name: Python Static Code Analysis CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  static-code-analysis:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Analysis Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pylint Code Inspection
      run: |
        pylint calculator.py app.py || true

    - name: Run Syntax & Lint Inspection (flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run Code Complexity Check (radon)
      run: |
        radon cc . -a -s || true

    - name: Run Security Vulnerability Audit (bandit)
      run: |
        bandit -r . -x ./venv --severity-level medium || true
